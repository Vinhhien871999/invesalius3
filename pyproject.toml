[project]
name = "InVesalius"
dynamic = ["version"]
description = "3D medical imaging reconstruction software"
keywords = [
  "medical imaging",
  "dicom",
  "segmentation",
  "3D printing",
  "neuronavigation",
]
dependencies = [
    "h5py==3.11.0",
    "imageio==2.34.2",
    "lib3mf==2.3.2",
    "matplotlib==3.9.0",
    "nibabel==5.2.1",
    "numpy==1.26.4",
    "onnx>=1.17.0",
    "onnxruntime-gpu==1.23.0 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "onnxruntime ; sys_platform == 'darwin'",
    "optitrack ; python_full_version == '3.8.*' and sys_platform == 'win32'",
    "pandas>=2.3.3",
    "pillow==10.3.0",
    "psutil==6.0.0",
    "polhemus==0.0.3; sys_platform == 'win32'",
    "polhemusFT==0.0.3; sys_platform == 'win32'",
    "pyacvd==0.2.11",
    "pyclaron ; python_full_version == '3.8.*' and sys_platform == 'win32'",
    "pypubsub==4.0.3",
    "pypolaris==0.0.8; sys_platform == 'win32'",
    "pyserial==3.5",
    "python-gdcm~=3.0.24",
    "requests>=2.32.3",
    "scikit-image==0.24.0",
    "scipy==1.14.0",
    "setuptools>=65,<68", # Constrained to <68 for wxPython 4.2.2 compatibility (copy_file signature issue) 
    "setuptools-scm<8",
    "tinygrad==0.10.2",
    "torch>=2.3.1",
    "vtk==9.3.0",
    "wxpython==4.2.5",
]
license = { file = "LICENSE.txt" }
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = "==3.12.*"


[dependency-groups]
dev = [
    "aioconsole==0.7.1",
    "mido==1.2.10",
    "mypy==1.10.1",
    "nest-asyncio==1.6.0",
    "pre-commit~=3.7.1",
    "python-rtmidi==1.5.8",
    "python-socketio[client]==5.11.3",
    "requests==2.32.3",
    "ruff~=0.5.0",
    "scikit-learn==1.5.0",
    "uvicorn[standard]==0.30.1",
    "maturin>=1.0,<2.0",
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
]


[project.gui-scripts]
inv = 'invesalius.app:main'

[project.optional-dependencies]
installer = [
    "pyinstaller>=6.12.0",
]
# CT3D thesis project (Phase 12, CT3D_P12_QUANTITATIVE_VALIDATION): the
# ROI Viewer plugin's "Export Mask -> NRRD" option (plugins/roi_viewer/
# core/exporters.py.export_mask_nrrd()) is optional - the plugin already
# fails soft (no crash) when this isn't installed, and the export UI
# (plugins/roi_viewer/gui/export_panel.py) detects it and tells the user
# clearly rather than implying NRRD is guaranteed to work. Install with
# `pip install invesalius[nrrd]` (or `uv sync --extra nrrd`) for real
# NRRD export.
nrrd = [
    "pynrrd>=1.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'"},
  { index = "pytorch-cu118", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
#To maintain compatibility with older GPUs.
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true


[tool.pytest.ini_options]
# CT3D thesis project (Phase 11, CT3D_P11_TEST_AUTOMATION): markers for
# plugins/roi_viewer's own persistent test suite under tests/ct3d/. Does
# not affect the pre-existing upstream tests/ suite (no markers required
# there - unmarked tests are unaffected by -m filters).
markers = [
    "unit: pure deterministic tests - no DICOM/GUI/VTK-renderer/dataset required",
    "integration: tests that use real InVesalius singletons (Project/Slice), VTK objects, or pubsub wiring, but no mouse/keyboard interaction",
    "gui: requires real GUI mouse/keyboard interaction - not automatable, never faked",
    "slow: relatively expensive integration tests (real DICOM import, full-size builds)",
    "dataset: requires an external DICOM dataset on disk",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"


[tool.maturin]
# Build the Rust extension module
features = ["pyo3/extension-module"]
# Manifest path for Rust project
manifest-path = "invesalius_rs/Cargo.toml"
# Module name - use _native suffix so __init__.py can wrap it
module-name = "invesalius_rs._native"
# Python source directory
python-source = "."
# Python packages to include
python-packages = ["invesalius", "invesalius_rs"]
# Strip the library for minimum file size
strip = true

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "invesalius_rs/src/**/*.rs" }, { file = "invesalius_rs/Cargo.toml" }, { file = "invesalius_rs/Cargo.lock" }]


[tool.setuptools]
packages = []
py-modules = []

[tool.setuptools_scm]
write_to = "invesalius/__version__.py"


[tool.mypy]
mypy_path = "typings"
show_error_codes = true
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
warn_redundant_casts = false
warn_unused_ignores = false
no_implicit_optional = false
strict_equality = false
warn_return_any = false
warn_unreachable = false
warn_unused_configs = false
no_implicit_reexport = false
follow_imports = "skip" # change to normal later
explicit_package_bases = true
disable_error_code =  ["attr-defined", "no-redef"]


[[tool.mypy.overrides]]
module = 'wx.*'
disable_error_code = ["no-redef"] # because some classes are redefined in the stubs
[[tool.mypy.overrides]]
module = [
    'wx.*',
    'vtkmodules.*',
    'pubsub.*',
    'scipy.*',
    'skimage.*',
    'serial.*',
    'gdcm.*',
    'pyacvd.*',
    'vtk.*',
    'scipy.spatial.*',
    'invesalius.data.camera_tracker.*',
    'aioconsole.*',
    'nest_asyncio.*',
    'uvicorn.*',
    'polhemus.*',
    'polhemusFT.*',
    'pyclaron.*',
    'urllib2.*',
    'optitrack.*',
    'ordereddict.*',
    'Image.*',
    'mido.*',
    'ConfigParser.*',
    'Queue.*',
    'weakrefmethod.*',
    'torchviz.*',
    'Trekker.*',
    'sklearn.*',
    'usb.*',
    'pypolaris.*',
    'pypolarisP4.*',
    'socketio.*',
    'setuptools.*',
    'psutil.*',
    'h5py.*',
    'info.*',
    'pandas.*',
    'PIL.*',
    'win32com.client.*',
    'win32com.*',
    'sigar.*',
    'numpy.*',
    'invesalius_rs.*',
    'lib3mf.*',
]
ignore_missing_imports = true


[tool.ruff]
include = ["pyproject.toml", "invesalius/**/*.py","app.py","typings/**/*.pyi"]
line-length = 100
extend-exclude = ["invesalius/__version__.py"]

[tool.ruff.lint]
extend-select = ["UP","I"] # Introduces linting rules for pyupgrade and isort
extend-ignore = ["E731"]

[tool.ruff.format]
line-ending = "lf"
